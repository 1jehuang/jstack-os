# jstack OS power policy. Keep the CPU efficient at all times, but request the
# lowest-latency energy/performance preference while connected to AC power.
CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave
CPU_ENERGY_PERF_POLICY_ON_AC=performance
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power

# Keep Wi-Fi responsive across AC/battery transitions. Power saving added
# gateway latency on the XPS BE211; this trades some battery life for latency.
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=off
