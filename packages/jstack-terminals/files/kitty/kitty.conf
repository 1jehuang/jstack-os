# Kitty Configuration

# Remote control (allows kitty @ commands from outside)
allow_remote_control yes
listen_on unix:/tmp/kitty.sock

# For single instance mode, use: kitty --single-instance
# Or create an alias: alias kitty='kitty --single-instance'

# Transparency & subtle blur
background_opacity 0.9
background_blur 5

# Colors (black background like Alacritty)
background #000000
foreground #cdd6f4
cursor #f5e0dc

# Cursor trail animation disabled
cursor_trail 0
# cursor_trail_decay 0.2 0.7
# cursor_trail_start_threshold 2

# Font settings (matching foot)
font_family JetBrainsMono Nerd Font Light
font_size 11
text_composition_strategy 1.5 70

# Window settings
confirm_os_window_close 0
remember_window_size no
initial_window_width 80c
initial_window_height 24c

# Tab bar
tab_bar_style powerline
tab_powerline_style slanted

# Scrollback (matching foot)
scrollback_lines 10000

# Scrollbar - minimal and non-interactive
scrollbar_width 0.2
scrollbar_hover_width 0.2
scrollbar_interactive no

# Hide mouse when typing (matching foot)
mouse_hide_wait 0

# Performance
repaint_delay 5
input_delay 0
sync_to_monitor yes
touch_scroll_multiplier 3.0

# Keybindings (matching foot)

# Disable Ctrl+D so kitty consumes it instead of sending EOF to the shell/app.
map ctrl+d no_op

# Disable kitty's default shortcuts that spawn/manage extra panes, tabs, or OS windows.
map ctrl+shift+enter no_op
map ctrl+shift+t no_op
map ctrl+shift+n no_op
map ctrl+shift+] no_op
map ctrl+shift+[ no_op
map ctrl+shift+l no_op
map ctrl+shift+right no_op
map ctrl+shift+left no_op
map ctrl+shift+. no_op
map ctrl+shift+, no_op
map ctrl+shift+q no_op
map ctrl+shift+f2 no_op
map ctrl+shift+f3 no_op
map ctrl+shift+f4 no_op

# Quit with Ctrl+Shift+W
map ctrl+shift+w close_os_window

# Half-page scroll with Ctrl+J/K (disabled in jcode)
map --when-focus-on var:in_jcode ctrl+j
map --when-focus-on var:in_jcode ctrl+k
map ctrl+j scroll_page_down
map ctrl+k scroll_page_up

# 5-line scroll with Ctrl+Shift+J/K
map ctrl+shift+j combine : scroll_line_down : scroll_line_down : scroll_line_down : scroll_line_down : scroll_line_down
map ctrl+shift+k combine : scroll_line_up : scroll_line_up : scroll_line_up : scroll_line_up : scroll_line_up

# Search with Ctrl+Shift+A
map ctrl+shift+a launch --type=overlay --stdin-source=@screen_scrollback /bin/sh -c "fzf --tac || true"

# URL hints with Ctrl+Shift+U
map ctrl+shift+u open_url_with_hints

# Copy/Paste (already default, but explicit)
copy_on_select clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Word movement with Ctrl+Alt+H/L
map ctrl+alt+h send_text all \x1bb
map ctrl+alt+l send_text all \x1bf

# Delete previous word with Ctrl+Backspace
map ctrl+backspace send_text all \x17
