# Foot config - matching Alacritty settings

[main]
font=monospace:size=11
# Transparency (0.0-1.0, same as Alacritty's 0.5)
# Note: blur is handled by Niri compositor, not foot
pad=0x0

[scrollback]
lines=10000
multiplier=3.0

[colors-dark]
background=000000
# Foot uses alpha separately
alpha=0.8

[key-bindings]
# Ctrl+Shift+W = Quit (close terminal)
quit=Control+Shift+w

# Ctrl+Shift+C/V = Copy/Paste
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v

# Ctrl+J/K = half-page scroll (terminal scrollback)
scrollback-down-half-page=Control+j
scrollback-up-half-page=Control+k
# Ctrl+Shift+J/K = 5-line scroll (terminal scrollback)
scrollback-down-line=Control+Shift+j
scrollback-up-line=Control+Shift+k

# Ctrl+Shift+A = Search mode (foot doesn't have full vi mode, just search)
search-start=Control+Shift+a

# Ctrl+Shift+R = Pipe scrollback to fzf (current terminal)
pipe-scrollback=[sh -c "fzf --tac || true"] Control+Shift+r

# Ctrl+Shift+D = Silent dump for global search (writes to temp file)
pipe-scrollback=[sh -c "mkdir -p /tmp/foot-global-search && cat > /tmp/foot-global-search/win-$(niri msg -j windows | jq -r '.[] | select(.is_focused) | .id')"] Control+Shift+d

# Disable default unicode-input to free up Ctrl+Shift+U
unicode-input=none

# Ctrl+Shift+U = URL hints/launcher
show-urls-launch=Control+Shift+u

[url]
# URL detection and launching
launch=xdg-open ${url}

[mouse]
hide-when-typing=yes
