[package]
name = "jstack-installer-staging"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Crash-safe release acceptance and artifact staging for the JStack no-USB installer"

[lib]
name = "jstack_installer_staging"
path = "src/lib.rs"

[dependencies]
fs4 = "1.1.0"
jstack-installer-core = { path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
thiserror = "2.0.19"

[target.'cfg(unix)'.dependencies]
libc = "0.2.180"
rustix = { version = "1.1.4", features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["alloc", "zeroize"] }
tempfile = "3.23.0"
