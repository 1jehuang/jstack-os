[package]
name = "jstack-installer-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Pure cross-platform planning and integrity core for the JStack no-USB installer"

[lib]
name = "jstack_installer_core"
path = "src/lib.rs"

[[bin]]
name = "jstack-plan"
path = "src/bin/jstack-plan.rs"

[[bin]]
name = "jstack-inventory"
path = "src/bin/jstack-inventory.rs"

[[bin]]
name = "jstack-release-fixture"
path = "src/bin/jstack-release-fixture.rs"

[[bin]]
name = "jstack-firmware"
path = "src/bin/jstack-firmware.rs"

[dependencies]
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["alloc", "zeroize"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
thiserror = "2.0.19"
uuid = { version = "1.24.0", features = ["serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = [
    "Win32_System_WindowsProgramming",
    "Win32_System_SystemInformation",
] }
