[package]
name = "jstack-installer-controller"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Verified typed state-graph loader and pure trace simulator for the JStack graph-driven installer controller"

[lib]
name = "jstack_installer_controller"
path = "src/lib.rs"

[dependencies]
jstack-installer-core = { path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
thiserror = "2.0.19"
